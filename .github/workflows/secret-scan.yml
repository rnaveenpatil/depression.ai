name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret is just as leaked if it was committed and
          # "removed" in a later commit.
          fetch-depth: 0

      - name: Scan working tree and full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Pull the config from the repo itself so rules stay reviewable.
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: detect --redact --verbose --config .gitleaks.toml

      - name: Verify no live credentials are referenced in tracked files
        run: |
          # Belt-and-braces check for the specific key classes that leaked
          # here before. Any hit fails the build.
          #
          # Scanner/config files are excluded: they legitimately contain
          # credential *patterns* (redact.py, .gitleaks.toml, this workflow).
          set -euo pipefail
          EXCLUDE='^src/agent/utils/redact\.py$|^\.gitleaks\.toml$|^\.github/workflows/secret-scan\.yml$|^\.githooks/|^docs/'

          fail=0
          check() {
            local name="$1" pattern="$2"
            if git grep -nEI "$pattern" -- . \
                 ':!src/agent/utils/redact.py' \
                 ':!.gitleaks.toml' \
                 ':!.github/workflows/secret-scan.yml' \
                 ':!.githooks/pre-commit' >/dev/null; then
              echo "::error::$name found in tracked files"
              git grep -nEI "$pattern" -- . \
                 ':!src/agent/utils/redact.py' \
                 ':!.gitleaks.toml' \
                 ':!.github/workflows/secret-scan.yml' \
                 ':!.githooks/pre-commit' | head -5
              fail=1
            else
              echo "ok: no $name in tracked files"
            fi
          }

          check "Google/Firebase API key" '\bAIza[0-9A-Za-z_-]{30,50}\b'
          check "Groq API key"            '\bgsk_[0-9A-Za-z]{48,}\b'
          check "AWS access key id"       '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
          check "GitHub token"            '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b'
          check "GitHub fine-grained PAT" '\bgithub_pat_[A-Za-z0-9_]{40,}\b'
          check "Slack token"             '\bxox[baprs]-[A-Za-z0-9-]{10,}'
          check "Private key block"       'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          exit $fail