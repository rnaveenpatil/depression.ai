name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin the scanner and verify its checksum instead of relying on whichever
      # version gitleaks-action happens to vendor. `dir` only exists from
      # gitleaks 8.19, so an unpinned action would break unpredictably.
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSfL -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ASSET}"
          echo "${GITLEAKS_SHA256}  gl.tar.gz" | sha256sum -c -
          tar xzf gl.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The current tree is the thing that actually ships, so it gets a strict,
      # unconditional scan of every tracked file. This is the strongest check
      # we run and it never fails for historical reasons.
      - name: Scan the working tree
        run: gitleaks dir . --redact --verbose --no-banner --config .gitleaks.toml

      # History is scanned only for commits that are NEW to this push, not for
      # the 90 older commits that already contain burned credentials. Those
      # values are public and must be revoked, not hidden, so a permanent red
      # build would train everyone to ignore this job. Range:
      #   push -> the commits this push introduced
      #   PR   -> everything the PR adds on top of the base
      - name: Scan commits introduced by this change
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="--all"
          fi
          echo "scanning range: $RANGE"
          gitleaks detect --redact --verbose --no-banner \
            --config .gitleaks.toml --log-opts="$RANGE"

      - name: Verify no live credentials are referenced in tracked files
        run: |
          # Belt-and-braces check for the specific key classes that leaked
          # here before. Any hit fails the build.
          #
          # Two exemptions, both narrow on purpose:
          #   1. Scanner/config files hold credential *patterns*, not secrets
          #      (redact.py, .gitleaks.toml, this workflow, .githooks/).
          #   2. The shipped Firebase Web config holds exactly one real
          #      credential-shaped value, pinned below by SHA-256 digest. A
          #      Firebase *web app* config is a public identifier set that
          #      ships in every web app; real protection is Security Rules +
          #      authorized domains + API-key restriction. A directory-wide
          #      exemption here would reopen the original hole, so only that
          #      one literal is stripped and only from that one file.
          set -euo pipefail

          SHIPPED_FIREBASE_FILE='src/agent/tui/onboarding/firebase_default.json'
          # Pinned by SHA-256, never read from the file being scanned. Deriving
          # the allowed value from the worktree would let the same commit swap
          # the key and approve itself, because the swapped value would become
          # the exempt one. This digest is a constant, so a changed key fails
          # here and must be reviewed deliberately in .gitleaks.toml too.
          SHIPPED_FIREBASE_SHA256='3ae4293e9a5db24f3a891f08249449b84826d5287237ffd0f889cca5850b215c'
          pin_rc=0
          SHIPPED_FIREBASE_KEY=$(SHIPPED_FILE="$SHIPPED_FIREBASE_FILE" \
            SHIPPED_SHA="$SHIPPED_FIREBASE_SHA256" python3 -c '
          import hashlib, json, os, sys
          path = os.environ["SHIPPED_FILE"]
          want = os.environ["SHIPPED_SHA"]
          try:
              key = json.load(open(path))["apiKey"]
          except Exception:
              sys.exit(0)  # no shipped key present; nothing to allow
          if hashlib.sha256(key.encode()).hexdigest() != want:
              print(
                  "The shipped Firebase key in %s does not match the pinned\n"
                  "digest. Changing it is allowed, but it must be a deliberate,\n"
                  "reviewed change: update SHIPPED_FIREBASE_SHA256 here and the\n"
                  "allowlist in .gitleaks.toml in the same commit." % path,
                  file=sys.stderr,
              )
              sys.exit(2)
          print(key)
          ') || pin_rc=$?
          if [ "$pin_rc" -eq 2 ]; then
            echo "::error::shipped Firebase key does not match the pinned digest"
            exit 1
          fi
          SHIPPED_FIREBASE_KEY=${SHIPPED_FIREBASE_KEY:-}

          fail=0
          report() {
            echo "::error::$1 found in tracked files"
            shift
            [ $# -gt 0 ] && printf '%s\n' "$@" | head -5
            fail=1
          }

          check() {
            local name="$1" pattern="$2" allow_file="${3:-}" allow_value="${4:-}"
            local -a paths=(
              ':!src/agent/utils/redact.py'
              ':!.gitleaks.toml'
              ':!.github/workflows/secret-scan.yml'
              ':!.githooks/pre-commit'
            )
            # The exempt file is handled separately below, so that its single
            # pinned literal can be tolerated while the rest of its contents
            # stay fully scanned. Everywhere else the pinned value is a hit.
            [ -n "$allow_file" ] && paths+=(":!$allow_file")

            # 1. Every ordinary path, scanned with no exemption at all.
            if git grep -qEI "$pattern" -- "${paths[@]}"; then
              report "$name" "$(git grep -nEI "$pattern" -- "${paths[@]}" \
                | sed -E 's/(.{0,12})[0-9A-Za-z_-]{16,}/\1...<redacted>/g')"
            fi

            # 2. The one exempt file: strip ONLY the pinned literal, then scan.
            #    The file is never skipped wholesale, so a second key, a
            #    service account or a token inside it is still caught.
            if [ -n "$allow_file" ] && [ -n "$allow_value" ] && [ -f "$allow_file" ]; then
              local stripped
              stripped=$(TARGET="$allow_file" ALLOW_VALUE="$allow_value" python3 -c '
          import os, sys
          path = os.environ["TARGET"]
          allowed = os.environ.get("ALLOW_VALUE", "")
          data = open(path, "rb").read().decode("utf-8", "replace")
          sys.stdout.write(data.replace(allowed, ""))
          ')
              local hits
              hits=$(printf '%s' "$stripped" | grep -oEI "$pattern" || true)
              if [ -n "$hits" ]; then
                report "$name in $allow_file" "$hits"
              fi
            fi

            [ "$fail" -eq 0 ] && echo "ok: no $name in tracked files"
            return 0
          }

          check "Google/Firebase API key" '\bAIza[0-9A-Za-z_-]{30,50}\b' \
                "$SHIPPED_FIREBASE_FILE" "$SHIPPED_FIREBASE_KEY"
          check "Groq API key"              '\bgsk_[0-9A-Za-z]{48,}\b'
          check "AWS access key id"         '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
          check "GitHub token"              '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b'
          check "GitHub fine-grained PAT"   '\bgithub_pat_[A-Za-z0-9_]{40,}\b'
          check "Slack token"               '\bxox[baprs]-[A-Za-z0-9-]{10,}'
          check "Private key block"         'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          check "Service account JSON"      '"type"[[:space:]]*:[[:space:]]*"service_account"'
          check "Google OAuth client secret" '\bGOCSPX-[A-Za-z0-9_-]{10,}'
          exit $fail