name: TUI smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[tui,dev]'
      - name: Unit tests
        run: pytest -q
      - name: TUI import smoke test
        run: python -c "from agent.tui.app import DepressionApp; assert DepressionApp"
