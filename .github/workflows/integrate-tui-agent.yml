name: Integrate TUI Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install textual httpx pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Apply TUI/agent integration
        run: python scripts/apply_tui_agent_integration.py

      - name: Syntax check
        run: python -m compileall -q src

      - name: Run tests
        run: pytest -q

      - name: TUI smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from textual.pilot import Pilot
          from agent.tui.app import DepressionApp

          async def smoke(app: DepressionApp, pilot: Pilot):
              assert app.query_one("#prompt-input") is not None
              assert app.query_one("#llm-base-url") is not None
              assert app.query_one("#llm-api-key") is not None
              assert app.query_one("#llm-model") is not None
              assert app.query_one("#aws-access-key") is not None
              assert app.query_one("#aws-secret-key") is not None
              assert app.query_one("#aws-region") is not None
              await pilot.press("/"[0]) if False else None

          app = DepressionApp(coordinator=None)
          app.run_test(smoke)
          print("TUI smoke test passed")
          PY

      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/tui/app.py src/agent/main.py src/agent/agent/dual_agent.py src/agent/llm/runtime.py src/agent/utils/env_manager.py .gitignore .env.example tests/test_env_and_runtime_config.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "integrate TUI with agent and user LLM/AWS env config"
            git push origin HEAD:main
          fi
