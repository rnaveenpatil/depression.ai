<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button {
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <button type="button" onclick="alert('Button clicked!')">Click Me</button>
</body>
</html>
