<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Landing Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #thunder-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            animation: flash 0.1s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            text-shadow: 0 0 20px #fff, 0 0 30px #00d4ff;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }

        button:hover {
            background: #00d4ff;
            color: #050505;
            box-shadow: 0 0 20px #00d4ff;
        }
    </style>
</head>
<body>

    <div id="thunder-container"></div>

    <div class="content">
        <h1>STORM COMING</h1>
        <button onclick="triggerThunder()">Call the Thunder</button>
    </div>

    <script>
        function triggerThunder() {
            const container = document.getElementById('thunder-container');
            const flash = document.createElement('div');
            flash.className = 'flash';
            container.appendChild(flash);
            
            // Remove after animation
            setTimeout(() => {
                flash.remove();
            }, 200);
        }

        // Random thunder
        setInterval(() => {
            if (Math.random() > 0.8) {
                triggerThunder();
            }
        }, 3000);
    </script>
</body>
</html>
