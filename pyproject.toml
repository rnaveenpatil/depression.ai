[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depression"
version = "1.0.0"
description = "AI agent for everything — development, deployment, and analysis"
readme = "README.md"
license = "ISC"
authors = [{name = "rnaveenpatil", email = "rnaveenpatil@example.com"}]
keywords = ["ai", "cli", "agent", "tui", "textual", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
tui = [
    "textual-dev>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
depression = "agent.main:main"
depression_ai = "agent.main:main"
depression-tui = "agent.tui.run:main"

[project.urls]
Homepage = "https://github.com/rnaveenpatil/depression.ai"
Repository = "https://github.com/rnaveenpatil/depression.ai"
Issues = "https://github.com/rnaveenpatil/depression.ai/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*.depression*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true