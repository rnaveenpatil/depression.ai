[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depression.ai"
version = "1.0.4"
description = "AI agent for everything — development, deployment, and analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "rnaveenpatil", email = "rnaveenpatil@example.com"}]
keywords = ["ai", "cli", "agent", "tui", "textual", "aws"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "requests>=2.31.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
# The dependency-free sign-in page still works without these; install them to
# get google-auth-oauthlib's installed-app flow instead:
#   pip install google-auth-oauthlib requests
gmail = [
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.31.0",
]
tui = [
    "textual-dev>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
depression = "agent.main:main"
depression_ai = "agent.main:main"
depression-tui = "agent.tui.run:main"

[project.urls]
Homepage = "https://github.com/rnaveenpatil/depression.ai"
Repository = "https://github.com/rnaveenpatil/depression.ai"
Issues = "https://github.com/rnaveenpatil/depression.ai/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*.depression*"]

# firebase_default.json is the shipped Firebase *web app* config (public
# identifiers, not a secret). It must be included in the wheel, otherwise a
# pip-installed package silently loses its default project.
[tool.setuptools.package-data]
"agent.tui.onboarding" = ["firebase_default.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true